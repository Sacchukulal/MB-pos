[package]
name = "mb-db"
description = "Magic Bill storage: the schema, the migration engine, and the connection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mb-core = { path = "../mb-core" }

# P11. mb-db depends on mb-auth so that a permission code read from a row
# becomes a typed `Permission` **at the row**, and an unknown one is an error
# there rather than a silent "denied" three layers up. That silent denial is
# BACKEND-G7, and it is why a typo in v1 could not be debugged from the counter.
mb-auth = { path = "../mb-auth" }

thiserror = "2"

# R6 / scope 16.15 — the one dependency this crate gets.
#
# `bundled` compiles SQLite into the binary. Two reasons: a Windows counter has
# no system SQLite to link against, and bundling PINS the SQLite version, so
# `RETURNING` (numbering.rs), WAL behaviour and DDL-inside-a-transaction are
# known quantities rather than whatever the machine happened to have.
#
# Size cost: roughly 1.5 MB in the release binary, against S4's 20 MB installer
# budget in docs/PERFORMANCE.md.
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }

# P24. The kitchen ticket keeps its individually-bumped lines as a small JSON
# array in its own row — read and written only with that row, never queried
# across tickets, which is the same shape `audit_log.before_json` already has.
# It was already a dev-dependency here; this promotes it.
serde_json = "1"

# The cloud round. A bill crosses the wire as the same `CartLine` / `Settlement` serde shapes
# mb-core already has, and a blob crosses as base64 because JSON has no bytes.
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
