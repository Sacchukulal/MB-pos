[package]
name = "mb-auth"
description = "Magic Bill identity: PINs, permissions, roles, the lockout rule and the audit chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mb-core = { path = "../mb-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# The audit trail's before/after is the ONE place JSON is allowed in this
# product (migration 0001 says so), and this crate is where that value is
# shaped. It is already a dependency of src-tauri.
serde_json = "1"

# R6 — the two dependencies this crate exists to contain.
#
# `argon2`: a 6-digit PIN is a million guesses, so against anybody holding a
# copy of the .db file the KDF's cost parameter IS the security. Hand-rolling a
# password hash in a product that holds a restaurant's money is worse than
# taking the dependency. RustCrypto's implementation, no unsafe, no C.
argon2 = { version = "0.5", features = ["std"] }

# `sha2`: the audit chain (item 10). Audit C4 asked for a *tamper-evident* log,
# and a trigger is not evidence — anybody with a SQLite browser can drop one. A
# hash chain is what makes an edited or deleted row show up.
sha2 = "0.10"

# P19: the device credential and the pairing token are random bytes that have
# to survive a QR code, a URL and a copy-paste unchanged. base64url is the
# answer, and writing an encoder whose only interesting property is being
# exactly right is not a good use of anybody's time.
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
