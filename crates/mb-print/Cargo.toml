[package]
name = "mb-print"
description = "Magic Bill printing: one document description, one traversal, several sinks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mb-core = { path = "../mb-core" }
serde = { version = "1", features = ["derive"] }
# The queue stores a job as the document it will print, and JSON is what
# crosses IPC to P08's preview anyway — one wire format, not two.
serde_json = "1"
thiserror = "2"

# P05's storage, for ONE module: queue/sqlite.rs (D32). The layout, the
# templates and the sinks still never touch a row — but a print queue that
# cannot survive a power cut is not a print queue, and that is audit D4.
mb-db = { path = "../mb-db" }

# R6 / PERFORMANCE.md §5 rule 8 — the one crate P07 adds, with its cost.
#
# fontdue rasterises a TrueType glyph to a coverage bitmap and does nothing
# else: no image decoding, no font discovery, no shaping. `default-features =
# false` drops its `hashbrown` and `simd` features — we cache glyphs ourselves
# and rasterise about a hundred of them per boot, so neither pays for itself.
#
# Why a crate at all: the workspace forbids `unsafe_code`, which rules out
# asking Windows to rasterise through GDI, and a hand-written TrueType
# rasteriser is outline parsing, composite glyphs and scan-line filling — a
# month of somebody's life to be worse at it.
#
# Size: roughly 60 KB of the release binary, plus the 133 KB font in assets/,
# against S4's 20 MB installer budget.
fontdue = { version = "0.9", default-features = false }

# The QR encoder, for the two places the printer's own `GS ( k` cannot reach: the on-screen
# preview, which is the printer's raster and has no encoder of its own, and a printer without
# one. Already compiled into the binary behind `mb-lan` (the pairing code), so it adds no new
# code — the same argument `src-tauri` makes for `base64`. `default-features = false` drops
# its image and SVG renderers; this crate draws the modules itself.
qrcode = { version = "0.14", default-features = false }

# P07's two OS transports, and the only crate in this workspace that may say
# `unsafe` (D34). Windows only; everything else here builds and tests without
# it, which is why the queue tests all run against the File transport.
[target.'cfg(windows)'.dependencies]
mb-winprint = { path = "../mb-winprint" }
