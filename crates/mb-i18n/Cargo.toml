[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

# ---------------------------------------------------------------------------
# R6 — and the honest answer is that this crate has NO i18n dependency, on
# purpose. The prompt asked for the reasoning either way, so here it is.
#
# `fluent` is the serious library and it is the right answer for a product with
# translators working in parallel, gendered agreement, or a dozen locales: it
# has a bundle format, a parser, a resolver and a syntax of its own.
#
# What this product needs is a key, three tables, two plural forms and named
# placeholders. Against that, `fluent` costs:
#
#   * a runtime parse step on a machine whose start-up budget (S1) is 3.0 s on
#     a 5400 rpm disk;
#   * a syntax the next session has to learn before it can add a string;
#   * and — the one that decides it — **a missing key becomes a runtime
#     fallback rather than a compile error.** Here, `Entry` cannot be
#     constructed without all three languages, so "every key exists in every
#     language" is not a test that runs. It is the type.
#
# If a fourth and fifth language arrive, or if translators start working in a
# tool that exports `.ftl`, revisit this. The shape to change is `catalogue.rs`
# and nothing else.
# ---------------------------------------------------------------------------
