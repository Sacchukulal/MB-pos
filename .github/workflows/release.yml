# Cut a release — the procedure in docs/RELEASE.md, as a machine.
#
# > **ANDROID-G3:** *"Releases are cut by hand on this PC. CI signing exists but
# > is not enabled (the secrets were never added)."*
#
# The point of this file is not convenience. It is that a release must not
# depend on one laptop or one person (POS-C9), and a build from a tag can
# always be reproduced.
#
# **It publishes from a TAG and never from a branch.** What shipped has to be
# something anybody can rebuild, and "main at the time" is not that.
#
# It RUNS on a push to main as well, for two reasons that are really one:
#
# * A push to main is the rehearsal. The suite, clippy, the front-end guards and
#   the installer all run before anything is tagged, so a red build costs a
#   commit and not a version number.
# * GitHub scopes its caches to the ref that saved them, and a tag is its own
#   ref: a cache saved by v1.5.3 was invisible to v1.6.0. Every tag build
#   started from nothing — 15 minutes of tests and 12 of release compile, every
#   time. A cache saved on main is what a tag run is allowed to read, so main is
#   where it is saved (and only there: `save-if` below).
#
# But not twice for one commit: when main and a release tag arrive together the
# tag's run is the build, and the push to main does nothing (`decide` below).
#
# Three jobs. `checks` (three runners, one per slice of the suite) and `build`
# run side by side, so the wall clock is the longest of them and not the sum;
# `publish` waits for all of them, and is the only place anything reaches a
# shopkeeper.
#
# What comes out: a GitHub Release for the tag carrying the installer,
# `manifest.json` and `manifest.json.sig`. A counter looks at
# `releases/latest/download/manifest.json`, checks the signature with the same
# key it checks a licence with, downloads the installer, checks its SHA-256,
# installs it silently and comes back on the new version.

name: release
run-name: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('check main @ {0}', github.sha) }}

on:
  push:
    branches: [main]
    tags: ['v*']
    # Words are not built. (GitHub ignores path filters for tags, as it should.)
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Run by hand with no inputs: the whole pipeline, publishing nothing. With a
  # tag: only `manifest` below — the manifest of that release, written and
  # signed again, which is how a rollout is staged or pulled back (RELEASE.md
  # sections 3 and 4) and how wrong notes are corrected.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Republish the manifest of this release (v1.6.2)'
        required: false
        default: ''
      percent:
        description: 'rollout.percent for it (0 pulls the release back)'
        required: false
        default: '100'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # One question, answered in seconds on the cheapest runner: is this push to
  # main the same commit a release tag points at? Then the tag's run is the
  # build, and this one would be the same twenty minutes again.
  # ---------------------------------------------------------------------------
  decide:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.same.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref_type == 'branch'
        with:
          fetch-tags: true
      - id: same
        if: github.ref_type == 'branch'
        run: |
          tag=$(git tag --points-at HEAD | grep '^v' | head -n 1 || true)
          if [ -n "$tag" ]; then
            echo "this commit is $tag; its release run is the build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Nothing is published until everything passes. A release that skips the
  # suite to get out faster is the release that needs rolling back.
  #
  # The suite is every test, but not on one runner: compiled warm it is a
  # minute and a half of building and eleven of running, most of that the
  # counter's own tests and mb-db's. So the counter, mb-db and the rest each get
  # a runner, and the rest's runner also carries clippy and the front end.
  # Nothing is dropped; the slices only stop waiting for each other.
  #
  # Cheapest gate first on the runner that has them: the front end answers in
  # under two minutes, and 1.6.0 spent 25 minutes finding out what 45 seconds
  # would have told it.
  # ---------------------------------------------------------------------------
  checks:
    needs: decide
    if: needs.decide.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.tag == '')
    strategy:
      fail-fast: false
      matrix:
        part: [counter, db, rest]
    name: checks (${{ matrix.part }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per slice: they compile different things. Saved only after a
          # green run: a run that fell over before compiling once saved a near-empty
          # cache under the key, and every run after restored it, matched it, and
          # kept it — so the caches were always warm and the builds always cold.
          shared-key: checks-${{ matrix.part }}
          save-if: ${{ github.ref_type == 'branch' }}

      - uses: actions/setup-node@v4
        if: matrix.part == 'rest'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the front end
        if: matrix.part == 'rest'
        working-directory: ui
        run: npm ci

      # The versions must agree. Three files carry it (and Cargo.lock behind
      # them), and a release where they disagree is a counter that offers itself
      # an update forever.
      - name: The versions agree with the tag
        if: matrix.part == 'rest' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $ui    = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          "tag=$tag cargo=$cargo tauri=$tauri ui=$ui"
          if ($tag -ne $cargo -or $tag -ne $tauri -or $tag -ne $ui) {
            throw "the tag and the three version fields do not agree"
          }

      # Cargo.lock carries the workspace version too; `--locked` refuses a lock
      # that was not brought along, here rather than 15 minutes in.
      - name: Cargo.lock is current
        if: matrix.part == 'rest'
        shell: pwsh
        run: cargo metadata --locked --format-version 1 > $null

      - name: Front-end types
        if: matrix.part == 'rest'
        working-directory: ui
        run: npm run typecheck

      - name: The front-end guards
        if: matrix.part == 'rest'
        working-directory: ui
        run: npm run lint

      - name: Front-end tests
        if: matrix.part == 'rest'
        working-directory: ui
        run: npm run test

      - name: The counter's tests
        if: matrix.part == 'counter'
        run: cargo test -p magic-bill --locked

      - name: The database's tests
        if: matrix.part == 'db'
        run: cargo test -p mb-db --locked

      - name: Every other crate's tests
        if: matrix.part == 'rest'
        run: cargo test --workspace --exclude magic-bill --exclude mb-db --locked

      - name: Clippy
        if: matrix.part == 'rest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ---------------------------------------------------------------------------
  # The installer: `tauri build` runs `npm run build`, builds the release
  # binary with the custom protocol (without it the binary looks for a dev
  # server that is not there) and bundles the NSIS installer — the .exe only,
  # `bundle.targets` in tauri.conf.json.
  #
  # The CLI is the npm package in ui/devDependencies: the same tauri-cli, the
  # same version as `cargo tauri` on the developer's PC, arriving prebuilt in
  # seconds instead of compiled from source in ten minutes.
  # ---------------------------------------------------------------------------
  build:
    needs: decide
    if: needs.decide.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.tag == '')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The checkout action writes the pushed tag as a plain pointer at the commit, so
      # `git tag -l --format='%(contents:subject)'` read the COMMIT's subject — which is how
      # a developer's commit line reached shopkeepers as the notes of 1.5.3 and 1.6.2. The
      # annotated tag, with the two sentences on it, has to be fetched back on purpose.
      - name: The tag itself, not a pointer at its commit
        if: github.ref_type == 'tag'
        shell: bash
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.ref_type == 'branch' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the front end
        working-directory: ui
        run: npm ci

      # From the repository root: the CLI finds src-tauri/ from where it is run,
      # and from ui/ it finds nothing. Bash, not pwsh: PowerShell swallows the
      # bare "--" that tells the CLI where cargo's own arguments begin.
      - name: Build the installer
        shell: bash
        run: ./ui/node_modules/.bin/tauri build -- --locked

      - name: Name the installer, measure it, fingerprint it
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter '*-setup.exe' target/release/bundle | Select-Object -First 1
          if (-not $exe) { throw "no installer was produced" }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist > $null
          $named = Join-Path (Resolve-Path dist) "Magic-Bill-$version-setup.exe"
          Move-Item $exe.FullName $named -Force
          $mb = [math]::Round((Get-Item $named).Length / 1MB, 1)
          "installer: $named ($mb MB; S4 budget 20 MB, ceiling 30 MB)"
          if ($mb -gt 30) { throw "the installer is past its S4 ceiling at $mb MB" }
          if ($mb -gt 20) { Write-Warning "the installer is past its S4 budget at $mb MB" }
          $sha = (Get-FileHash $named -Algorithm SHA256).Hash.ToLower()
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      # The manifest: what the counter reads. Signed with the release key (the
      # licence key — one trust root). ANDROID-G2: the counter checks the
      # signature AND the hash, because they answer different questions — "we
      # published it" and "all of it arrived". Written on a main run too, so the
      # whole pipeline is rehearsed; it goes nowhere from there.
      - name: Write and sign the manifest
        env:
          MB_RELEASE_KEY: ${{ secrets.MB_RELEASE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:MB_RELEASE_KEY) {
            throw "MB_RELEASE_KEY is not set — see docs/RELEASE.md section 5. This is POS-C9."
          }
          $version = "${{ steps.installer.outputs.version }}"
          # The notes are the tag's message: two plain sentences for a shopkeeper.
          # On a main run there is no tag yet, and git answers with nothing.
          $notes = "$(git tag -l --format='%(contents:subject)' "v$version")".Trim()
          if (-not $notes) { $notes = "Version $version." }
          $manifest = [ordered]@{
            version = $version
            notes   = $notes
            url     = "https://github.com/${{ github.repository }}/releases/download/v$version/Magic-Bill-$version-setup.exe"
            sha256  = "${{ steps.installer.outputs.sha256 }}"
            rollout = [ordered]@{ percent = 100; shops = @() }
          }
          $json = $manifest | ConvertTo-Json -Compress -Depth 4
          [IO.File]::WriteAllText("dist/manifest.json", $json)
          cargo run --locked -p mb-license --example sign -- dist/manifest.json
          Get-Content dist/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: magic-bill-windows
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The only step that reaches a shopkeeper, and it waits for all of the
  # others. A tag whose suite failed publishes nothing.
  # ---------------------------------------------------------------------------
  publish:
    if: github.ref_type == 'tag'
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: magic-bill-windows
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false

  # ---------------------------------------------------------------------------
  # The manifest of a release that is already out, written and signed again:
  # the same installer, its hash taken afresh, the notes from the tag, and the
  # rollout percentage given. Nothing is rebuilt, and no installer is touched.
  # ---------------------------------------------------------------------------
  manifest:
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: The tag itself, not a pointer at its commit
        shell: bash
        run: git fetch --force origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}"

      - uses: dtolnay/rust-toolchain@stable

      - name: The installer that shipped
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download "${{ inputs.tag }}" --pattern 'Magic-Bill-*-setup.exe' --dir dist

      - name: Write and sign the manifest
        env:
          MB_RELEASE_KEY: ${{ secrets.MB_RELEASE_KEY }}
          TAG: ${{ inputs.tag }}
          PERCENT: ${{ inputs.percent }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MB_RELEASE_KEY" ]; then
            echo "MB_RELEASE_KEY is not set — see docs/RELEASE.md section 5. This is POS-C9." >&2
            exit 1
          fi
          version="${TAG#v}"
          exe="dist/Magic-Bill-$version-setup.exe"
          [ -f "$exe" ] || { echo "no $exe on the release" >&2; exit 1; }
          sha=$(sha256sum "$exe" | cut -d' ' -f1)
          notes=$(git tag -l --format='%(contents:subject)' "$TAG" | sed 's/[[:space:]]*$//')
          [ -n "$notes" ] || notes="Version $version."
          case "$PERCENT" in ''|*[!0-9]*) echo "percent must be a whole number: $PERCENT" >&2; exit 1;; esac
          jq -cn --arg v "$version" --arg n "$notes" --arg s "$sha" --argjson p "$PERCENT" \
            --arg u "https://github.com/${{ github.repository }}/releases/download/$TAG/Magic-Bill-$version-setup.exe" \
            '{version: $v, notes: $n, url: $u, sha256: $s, rollout: {percent: $p, shops: []}}' \
            > dist/manifest.json
          cargo run --locked -p mb-license --example sign -- dist/manifest.json
          cat dist/manifest.json

      - name: Replace it on the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ inputs.tag }}" dist/manifest.json dist/manifest.json.sig --clobber
