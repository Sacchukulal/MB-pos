[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.90"
license = "proprietary"

[workspace.lints.rust]
unsafe_code = "forbid"

# D7: nothing in the money path may be silently lossy. These are denied
# workspace-wide rather than left to review.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
integer_division = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
float_arithmetic = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
