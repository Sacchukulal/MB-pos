[package]
name = "magic-bill"
description = "Magic Bill — the counter. The shell, the IPC boundary, and the only crate that holds state for the life of the process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mb-auth = { path = "../crates/mb-auth" }
mb-core = { path = "../crates/mb-core" }
mb-db = { path = "../crates/mb-db" }
mb-print = { path = "../crates/mb-print" }
# P19 — the counter as a server. It owns the sockets and no business rule; see
# its own Cargo.toml for why an async runtime is right here and was wrong for
# the print queue.
mb-lan = { path = "../crates/mb-lan" }
# P21. The entitlement, and the gate that structurally cannot reach billing.
mb-license = { path = "../crates/mb-license" }

# P17. "Which printers does this machine have?" is an operating-system
# question, and this is the crate that talks to the operating system â it
# already owns the window, the single-instance lock and the config folder.
# mb-winprint is where D31 put all the `unsafe`, and it is already linked in
# through mb-print, so this costs nothing in the binary.
mb-winprint = { path = "../crates/mb-winprint" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# D1 — "Rust core, React screens only". Tauri is that decision's runtime: a
# WebView2 window (already on every Windows 10/11 machine, so it is not in the
# installer) plus an IPC bridge, against Electron's ~150 MB of bundled Chromium.
# S4 budgets 20 MB for the whole installer, which rules out the alternative.
tauri = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# P22. Both of these are already in `Cargo.lock` — `regex` behind Tauri's own
# tooling and `flate2` (which `zip` uses) behind the bundler — so neither is
# new compiled code in a meaningful sense. S4 is a 20 MB installer budget and
# that is the number these have to justify themselves against.
# ---------------------------------------------------------------------------

# The log's secret scanner (`redact.rs`). Six patterns, each of which has to be
# exactly right about word boundaries — the first hand-rolled version of the
# phone rule matched every millisecond timestamp in the file. This is the same
# argument `mb-lan` makes for taking `base64` rather than writing an encoder
# whose only interesting property is being correct.
regex = "1"

# SHA-256 for the update package's fingerprint (ANDROID-G2). Already in the
# tree through rustls and `mb-license`; taking it here rather than adding a
# second hashing crate keeps one implementation of one algorithm.
ring = "0.17"

# The diagnostics bundle. Writing a ZIP central directory by hand is about two
# hundred lines whose only job is to be byte-exact, and a bundle a shopkeeper
# cannot open is a support call that got worse. `default-features = false` plus
# `deflate` keeps it to the one compression method Windows Explorer opens
# natively, over the flate2 already in the tree.
zip = { version = "2", default-features = false, features = ["deflate"] }

# One instance per PC. Two counters on one machine fight over the database, the
# licence and the numbering — and the second one must FOCUS the first window,
# not die quietly, because "it won't open" is the bug report that follows.
tauri-plugin-single-instance = "2"

# R6 — the type generator. `cargo test` regenerates the TypeScript and diffs
# it, so the two sides of the IPC boundary cannot drift apart. Build-time only:
# it contributes nothing to the shipped binary.
ts-rs = { version = "12", features = ["serde-compat"] }

[features]
# *** A RELEASE BUILD NEEDS THIS FEATURE, AND FORGETTING IT IS A TRAP. ***
#
#     cargo build --release -p magic-bill --features custom-protocol
#
# Without it the release binary serves the frontend from `devUrl`
# (http://localhost:5173) instead of from the assets baked into it, so the
# shipped application opens on "localhost refused to connect" — on a customer's
# machine, where there is no dev server and never will be.
#
# It is not the default because `cargo run` in development is meant to use the
# Vite dev server for hot reload. The Tauri CLI passes this automatically for
# `tauri build`; a plain `cargo build --release` does not, which is exactly how
# this was found at P08 — by building the release binary, running it, and
# looking at the window.
custom-protocol = ["tauri/custom-protocol"]
